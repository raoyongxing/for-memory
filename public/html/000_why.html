<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/article.css">
    <title>序·我的记忆</title>
</head>
<body>
    <main class="article">
        <p class="article-p">
            我为什么要开启这个系列？ 
        </p>
        <p class="article-p">
            因为我发现自己的记忆力实在有限，走了近30年，为什么那么多人，那么多的记忆都不清晰了。所以趁我还记得，把他们记录下来。给我自己一个交代，也给他们一个交代。
            也正因为记忆力有限，所以文章的内容可以算不能保证完全客观真实，我不是历史的史官，我只是自己的史官。
        </p>
        <p class="article-p">
            生成一篇文章简单，虚构一个故事也很简单。但是，如果没有真实的记忆承载，缺失情感和思考，文字就会失去其灵魂。
            在写人的文章中，这个问题也会尤其严重。我不鼓吹任何形式的文字，也不拒绝任何奇怪的语言，只要它是我真实想要表达的，那就有意义。
        </p>
    </main>
</body>
</html>
