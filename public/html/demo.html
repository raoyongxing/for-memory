<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>无级过渡拖拽走马灯 | 幅度越大切换越多</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* 避免拖拽时选中文本/图片 */
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(145deg, #1a2a3a 0%, #0f1a24 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
            padding: 20px;
        }

        /* 主卡片容器 */
        .carousel-card {
            background: rgba(20, 28, 35, 0.7);
            backdrop-filter: blur(4px);
            border-radius: 48px;
            padding: 20px 16px 24px 16px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }

        /* 走马灯主容器 */
        .carousel-container {
            position: relative;
            width: 900px;
            max-width: 85vw;
            border-radius: 32px;
            overflow: hidden;
            background: #0b1015;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.05);
        }

        /* 视口: 隐藏溢出，每个item撑满宽度 */
        .carousel-viewport {
            overflow: hidden;
            position: relative;
            cursor: grab;
            touch-action: none;  /* 完全由JS控制拖拽，禁止默认滚动/缩放 */
        }

        .carousel-viewport:active {
            cursor: grabbing;
        }

        /* 图片轨道 - flex 横向排列，无级过渡由 transform 完成 */
        .carousel-track {
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            will-change: transform;
            transition: transform 0s;  /* 默认无过渡，拖拽实时跟随，松手后动态添加过渡动画 */
        }

        /* 每个走马灯项，宽度等于视口宽度，实现一屏一图 */
        .carousel-item {
            flex: 0 0 100%;
            width: 100%;
            position: relative;
            aspect-ratio: 16 / 9;  /* 优雅宽高比，图片内容自适应 */
            background: #10161e;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* 图片/内容样式 */
        .carousel-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;  /* 避免图片事件干扰拖拽 */
            transition: transform 0.3s ease;
        }

        /* 优雅渐变文字层（仅用于演示） */
        .item-label {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            padding: 8px 18px;
            border-radius: 60px;
            color: white;
            font-weight: 600;
            font-size: 1.2rem;
            letter-spacing: 1px;
            border-left: 3px solid #ffb347;
            pointer-events: none;
            font-family: monospace;
        }

        /* 指示器区域 */
        .indicators {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .dot {
            width: 44px;
            height: 5px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            cursor: pointer;
        }

        .dot.active {
            background: #ffb347;
            width: 64px;
            box-shadow: 0 0 8px #ffb347aa;
        }

        /* 拖拽幅度反馈信息 */
        .swipe-feedback {
            text-align: center;
            margin-top: 18px;
            font-size: 0.9rem;
            font-weight: 500;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(4px);
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            padding: 8px 20px;
            border-radius: 60px;
            color: #dddddd;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 180, 71, 0.3);
            transition: all 0.2s;
        }

        .swipe-feedback span {
            color: #ffb347;
            font-weight: bold;
            font-size: 1.1rem;
        }

        /* 提示小标签 */
        .drag-hint {
            text-align: center;
            margin-top: 16px;
            font-size: 0.75rem;
            color: #8899aa;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .drag-hint i {
            font-style: normal;
            background: #1e2a32;
            padding: 4px 12px;
            border-radius: 50px;
        }

        @media (max-width: 680px) {
            .carousel-container {
                max-width: 92vw;
                border-radius: 24px;
            }
            .item-label {
                font-size: 0.9rem;
                bottom: 12px;
                left: 12px;
            }
            .dot {
                width: 28px;
                height: 4px;
            }
            .dot.active {
                width: 42px;
            }
        }
    </style>
</head>
<body>
<div>
    <div class="carousel-card">
        <div class="carousel-container">
            <div class="carousel-viewport" id="carouselViewport">
                <div class="carousel-track" id="carouselTrack">
                    <!-- 动态生成5张高质量演示图片 (使用优质风景/数字艺术占位) -->
                    <!-- 为保证体验，采用渐变色 + 图片占位 + 数字编号，风格现代 -->
                </div>
            </div>
        </div>
        <div class="indicators" id="indicators"></div>
        <div class="swipe-feedback" id="swipeFeedback">
            💨 拖拽幅度 · 切换 <span id="jumpAmount">0</span> 张
        </div>
        <div class="drag-hint">
            <i>← → 拖拽滑动</i>
            <i>⚡ 幅度越大 | 一次切多张</i>
            <i>✨ 无级过渡</i>
        </div>
    </div>
</div>

<script>
    (function(){
        // ---------- 配置 ----------
        const ITEM_COUNT = 6;          // 图片张数 6张 展示丰富拖拽效果
        // 图片主题: 使用高质量渐变色+ 优雅emoji或实际图片，但更美观采用内联SVG样式的模拟，但为了真实感使用高清风景占位图（unsplash 风格ID)
        // 为了稳定且无网络依赖，使用 CSS 渐变 + 图案 + 编号，同时展示漂亮视觉，完全符合展示预期
        // 但为了走马灯视觉丰富，创建6张不同鲜明色彩的卡片并带文字
        
        // 获取DOM元素
        const viewport = document.getElementById('carouselViewport');
        const track = document.getElementById('carouselTrack');
        const indicatorsContainer = document.getElementById('indicators');
        const jumpAmountSpan = document.getElementById('jumpAmount');
        
        let items = [];          // 存储每个item DOM
        let currentIndex = 0;    // 当前展示索引 (0 - ITEM_COUNT-1)
        let itemWidth = 0;        // 每个item宽度 = 视口宽度
        let totalWidth = 0;       // track总宽度
        
        // 拖拽状态
        let isDragging = false;
        let startX = 0;
        let startOffset = 0;       // 拖拽起始时的transform偏移量(px)
        let currentOffset = 0;     // 拖拽过程中实时的偏移量(px, 受边界限制)
        let dragActive = false;
        
        // 过渡动画相关
        let isTransitioning = false;
        let transitionTimer = null;
        
        // 边界偏移范围 (minOffset, maxOffset)  maxOffset = 0, minOffset = -(totalWidth - viewport.clientWidth)
        let minOffset = 0;
        let maxOffset = 0;
        
        // ----- 生成漂亮的图片内容 (现代风格, 每张不同主题色和图标) -----
        const themes = [
            { name: "晨曦云海", gradient: "linear-gradient(135deg, #FFB347, #FF6B6B)", icon: "🌅" },
            { name: "极光幻境", gradient: "linear-gradient(225deg, #1F1C2C, #928DAB)", icon: "🌌" },
            { name: "琥珀森林", gradient: "linear-gradient(120deg, #D4AF37, #7B3F00)", icon: "🌲" },
            { name: "冰蓝星球", gradient: "linear-gradient(160deg, #1E3C72, #2A5298)", icon: "❄️" },
            { name: "紫藤花语", gradient: "linear-gradient(100deg, #AA076B, #61045F)", icon: "🌸" },
            { name: "霓虹都市", gradient: "linear-gradient(80deg, #0F2027, #203A43, #2C5364)", icon: "🌃" }
        ];
        
        // 构建track内容
        function buildCarouselItems() {
            track.innerHTML = '';
            for (let i = 0; i < ITEM_COUNT; i++) {
                const theme = themes[i % themes.length];
                const itemDiv = document.createElement('div');
                itemDiv.className = 'carousel-item';
                // 高级视觉: 内嵌优雅渐变背景 + 大号图标 + 序号
                itemDiv.style.background = theme.gradient;
                itemDiv.style.position = 'relative';
                // 添加内容
                const contentWrapper = document.createElement('div');
                contentWrapper.style.display = 'flex';
                contentWrapper.style.flexDirection = 'column';
                contentWrapper.style.alignItems = 'center';
                contentWrapper.style.justifyContent = 'center';
                contentWrapper.style.height = '100%';
                contentWrapper.style.width = '100%';
                contentWrapper.style.color = 'white';
                contentWrapper.style.textShadow = '0 2px 12px rgba(0,0,0,0.5)';
                
                const iconSpan = document.createElement('div');
                iconSpan.style.fontSize = '5rem';
                iconSpan.style.marginBottom = '0.75rem';
                iconSpan.style.filter = 'drop-shadow(0 6px 12px rgba(0,0,0,0.3))';
                iconSpan.innerText = theme.icon;
                
                const titleSpan = document.createElement('div');
                titleSpan.style.fontSize = '2rem';
                titleSpan.style.fontWeight = '700';
                titleSpan.style.letterSpacing = '2px';
                titleSpan.innerText = theme.name;
                
                const indexSpan = document.createElement('div');
                indexSpan.style.fontSize = '1rem';
                indexSpan.style.marginTop = '12px';
                indexSpan.style.background = 'rgba(0,0,0,0.4)';
                indexSpan.style.backdropFilter = 'blur(8px)';
                indexSpan.style.padding = '4px 16px';
                indexSpan.style.borderRadius = '60px';
                indexSpan.innerText = ` ${i+1} / ${ITEM_COUNT}`;
                
                contentWrapper.appendChild(iconSpan);
                contentWrapper.appendChild(titleSpan);
                contentWrapper.appendChild(indexSpan);
                itemDiv.appendChild(contentWrapper);
                
                // 可增加底部小标签装饰
                const labelBadge = document.createElement('div');
                labelBadge.className = 'item-label';
                labelBadge.innerText = theme.name;
                itemDiv.appendChild(labelBadge);
                
                track.appendChild(itemDiv);
                items.push(itemDiv);
            }
        }
        
        // 更新指示点样式
        function updateIndicators() {
            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, idx) => {
                if (idx === currentIndex) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
        }
        
        // 构建指示器UI
        function buildIndicators() {
            indicatorsContainer.innerHTML = '';
            for (let i = 0; i < ITEM_COUNT; i++) {
                const dot = document.createElement('div');
                dot.classList.add('dot');
                if (i === currentIndex) dot.classList.add('active');
                dot.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (isTransitioning) return;
                    if (i === currentIndex) return;
                    // 点击指示器直接切换，平滑过渡，但根据设计也是无级过渡风格
                    jumpToIndex(i, true);
                });
                indicatorsContainer.appendChild(dot);
            }
        }
        
        // 重置过渡动画辅助方法: 清除过渡和计时器，保证拖拽流畅
        function clearTransition() {
            if (transitionTimer) {
                clearTimeout(transitionTimer);
                transitionTimer = null;
            }
            if (isTransitioning) {
                track.style.transition = '';
                isTransitioning = false;
            }
        }
        
        // 直接设置偏移量(无过渡)，更新transform
        function setOffsetRaw(offset) {
            track.style.transform = `translateX(${offset}px)`;
            currentOffset = offset;
        }
        
        // 更新偏移量边界限制
        function clampOffset(offset) {
            if (offset > maxOffset) return maxOffset;
            if (offset < minOffset) return minOffset;
            return offset;
        }
        
        // 获取当前索引对应的标准偏移量
        function getOffsetByIndex(index) {
            return -index * itemWidth;
        }
        
        // 更新尺寸 (响应视口变化)
        function updateDimensions() {
            if (!viewport) return;
            const newWidth = viewport.clientWidth;
            if (newWidth === 0) return;
            itemWidth = newWidth;
            // 更新每个item宽度
            items.forEach(item => {
                item.style.flexBasis = `${itemWidth}px`;
            });
            totalWidth = itemWidth * ITEM_COUNT;
            // 边界范围: maxOffset 为 0 (最左侧第一张完全显示), minOffset = -(totalWidth - itemWidth)
            // 注意视口宽度就是itemWidth，可滚动的总距离 = totalWidth - itemWidth
            maxOffset = 0;
            minOffset = -(totalWidth - itemWidth);
            // 修正当前索引偏移，避免索引超出边界后偏移错误
            const correctOffset = getOffsetByIndex(currentIndex);
            setOffsetRaw(correctOffset);
            currentOffset = correctOffset;
        }
        
        // 平滑动画跳转到指定索引 (带动画过渡, 并且根据幅度 该函数主要用于回弹/点击指示器/最终切换)
        function jumpToIndex(targetIndex, withAnimation = true) {
            if (targetIndex < 0) targetIndex = 0;
            if (targetIndex >= ITEM_COUNT) targetIndex = ITEM_COUNT - 1;
            if (targetIndex === currentIndex && withAnimation) {
                // 相同索引但偏移可能因边界抖动，可以回正
                const targetOff = getOffsetByIndex(currentIndex);
                if (Math.abs(currentOffset - targetOff) > 0.5) {
                    animateToOffset(targetOff, () => {});
                }
                return;
            }
            const targetOffset = getOffsetByIndex(targetIndex);
            if (!withAnimation) {
                setOffsetRaw(targetOffset);
                currentIndex = targetIndex;
                updateIndicators();
                return;
            }
            // 执行动画过渡
            clearTransition(); // 清除残留
            track.style.transition = 'transform 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1)';
            isTransitioning = true;
            setOffsetRaw(targetOffset);
            
            const onFinish = () => {
                track.style.transition = '';
                isTransitioning = false;
                currentIndex = targetIndex;
                currentOffset = targetOffset;
                updateIndicators();
                if (transitionTimer) clearTimeout(transitionTimer);
                transitionTimer = null;
                track.removeEventListener('transitionend', onFinish);
            };
            track.addEventListener('transitionend', onFinish, { once: true });
            // 保险计时器
            transitionTimer = setTimeout(() => {
                if (isTransitioning) {
                    track.style.transition = '';
                    isTransitioning = false;
                    currentIndex = targetIndex;
                    currentOffset = targetOffset;
                    updateIndicators();
                    track.removeEventListener('transitionend', onFinish);
                }
                transitionTimer = null;
            }, 500);
        }
        
        // 根据实际偏移变化量（deltaOffset）来决定切换几张，并执行最终移动
        // deltaOffset: 实际图片滑动距离（受边界限制后）正值表示向右滑动（图片右移，上一张），负值表示向左滑动（下一张）
        function resolveSnapByDragDistance(deltaOffset) {
            if (deltaOffset === 0) {
                // 没有有效滑动，回弹到当前索引
                animateToOffset(getOffsetByIndex(currentIndex), false);
                jumpAmountSpan.innerText = '0';
                return;
            }
            // 幅度决定切换张数: 使用 round 策略，滑动超过 0.5 倍宽切换1张，超过1.5倍宽切换2张，完全匹配“幅度越大切换越多”
            const rawSteps = deltaOffset / itemWidth;
            let steps = Math.round(rawSteps);
            if (steps === 0) {
                // 微调不足半张时直接回弹
                animateToOffset(getOffsetByIndex(currentIndex), false);
                jumpAmountSpan.innerText = '0';
                return;
            }
            // 新索引 = 当前索引 - steps (因为deltaOffset为正代表图片向右移动 => 展示前一张，索引减小)
            let newIndex = currentIndex - steps;
            // 边界裁剪
            const oldIndex = currentIndex;
            newIndex = Math.min(Math.max(0, newIndex), ITEM_COUNT - 1);
            const actualSteps = oldIndex - newIndex;  // 实际改变的张数 (正负代表方向)
            const absJump = Math.abs(actualSteps);
            jumpAmountSpan.innerText = absJump;
            if (newIndex === currentIndex) {
                // 边界导致无法切换，回弹
                animateToOffset(getOffsetByIndex(currentIndex), false);
                return;
            }
            // 执行切换到新索引
            const targetOffset = getOffsetByIndex(newIndex);
            animateToOffset(targetOffset, true, () => {
                currentIndex = newIndex;
                updateIndicators();
            });
        }
        
        // 带动画移动到目标偏移，更新currentIndex并更新标志
        function animateToOffset(targetOffset, withTransition = true, callback = null) {
            if (Math.abs(currentOffset - targetOffset) < 0.5) {
                if (callback) callback();
                return;
            }
            clearTransition();  // 清空之前过渡影响
            if (withTransition) {
                track.style.transition = 'transform 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1)';
                isTransitioning = true;
                setOffsetRaw(targetOffset);
                const finishHandler = () => {
                    track.style.transition = '';
                    isTransitioning = false;
                    currentOffset = targetOffset;
                    if (callback) callback();
                    track.removeEventListener('transitionend', finishHandler);
                    if (transitionTimer) clearTimeout(transitionTimer);
                    transitionTimer = null;
                };
                track.addEventListener('transitionend', finishHandler, { once: true });
                transitionTimer = setTimeout(() => {
                    if (isTransitioning) {
                        track.style.transition = '';
                        isTransitioning = false;
                        currentOffset = targetOffset;
                        if (callback) callback();
                    }
                    transitionTimer = null;
                }, 450);
            } else {
                // 无过渡直接跳转
                setOffsetRaw(targetOffset);
                currentOffset = targetOffset;
                if (callback) callback();
            }
        }
        
        // ----- 拖拽核心逻辑 (鼠标 & 触摸) -----
        function onDragStart(clientX) {
            if (isTransitioning) {
                // 如果正在过渡中，立刻中断过渡并设置到当前索引实际偏移位置，保证拖拽起点精准
                clearTransition();
                const correctOffset = getOffsetByIndex(currentIndex);
                setOffsetRaw(correctOffset);
                currentOffset = correctOffset;
            }
            isDragging = true;
            startX = clientX;
            startOffset = currentOffset;   // 当前实时的偏移量
            // 清除过渡样式保证无级拖拽跟随
            track.style.transition = '';
            isTransitioning = false;
            if (transitionTimer) clearTimeout(transitionTimer);
            // 更改光标样式已经在viewport中体现
        }
        
        function onDragMove(clientX) {
            if (!isDragging) return;
            const deltaX = clientX - startX;
            let newOffset = startOffset + deltaX;
            // 边界阻尼限制: 直接限制在 minOffset / maxOffset 范围内
            newOffset = clampOffset(newOffset);
            // 实时更新位置（无级过渡效果）
            setOffsetRaw(newOffset);
        }
        
        function onDragEnd() {
            if (!isDragging) return;
            isDragging = false;
            
            // 计算从开始到结束的实际偏移变化量（受边界限制后的最终偏移变化）
            const finalOffset = currentOffset;
            const deltaOffset = finalOffset - startOffset;  // 实际拖拽移动图片的有效距离
            
            // 根据幅度决定切换几张 (调用核心逻辑)
            if (Math.abs(deltaOffset) > 0) {
                resolveSnapByDragDistance(deltaOffset);
            } else {
                // 未移动或移动极轻微，回弹到当前索引位置
                const targetOffsetSnap = getOffsetByIndex(currentIndex);
                if (Math.abs(currentOffset - targetOffsetSnap) > 0.5) {
                    animateToOffset(targetOffsetSnap, true);
                    jumpAmountSpan.innerText = '0';
                } else {
                    jumpAmountSpan.innerText = '0';
                }
            }
        }
        
        // ----- 事件绑定 (鼠标 + 触摸) 支持跨平台-----
        function attachEvents() {
            // 鼠标事件
            viewport.addEventListener('mousedown', (e) => {
                e.preventDefault();
                onDragStart(e.clientX);
                window.addEventListener('mousemove', onMouseMove);
                window.addEventListener('mouseup', onMouseUp);
            });
            
            function onMouseMove(e) {
                e.preventDefault();
                onDragMove(e.clientX);
            }
            
            function onMouseUp(e) {
                onDragEnd();
                window.removeEventListener('mousemove', onMouseMove);
                window.removeEventListener('mouseup', onMouseUp);
            }
            
            // 触摸事件 (移动端)
            viewport.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                if (touch) onDragStart(touch.clientX);
            }, { passive: false });
            
            viewport.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                if (touch) onDragMove(touch.clientX);
            }, { passive: false });
            
            viewport.addEventListener('touchend', (e) => {
                e.preventDefault();
                onDragEnd();
            });
            
            viewport.addEventListener('touchcancel', (e) => {
                e.preventDefault();
                onDragEnd();
            });
            
            // 防止拖拽时选中页面其他内容
            viewport.addEventListener('dragstart', (e) => e.preventDefault());
        }
        
        // 监听窗口大小变化，重新计算尺寸，并修正位置
        function handleResize() {
            updateDimensions();
            // 确保当前索引偏移正确
            const correctOff = getOffsetByIndex(currentIndex);
            setOffsetRaw(correctOff);
            currentOffset = correctOff;
            if (!isDragging && !isTransitioning) {
                // 稳定重置偏移
            }
            updateIndicators();
        }
        
        // 初始化走马灯全部功能
        function init() {
            buildCarouselItems();
            buildIndicators();
            // 获取item列表更新
            items = Array.from(document.querySelectorAll('.carousel-item'));
            updateDimensions();
            attachEvents();
            window.addEventListener('resize', () => {
                setTimeout(handleResize, 80);
            });
            // 初始偏移为0
            setOffsetRaw(0);
            currentOffset = 0;
            currentIndex = 0;
            updateIndicators();
            jumpAmountSpan.innerText = '0';
            // 添加一点额外样式的平滑启动
        }
        
        init();
    })();
</script>
</body>
</html>
